name: Tests
on: [pull_request]

jobs:
  build:
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v2
      with:
        submodules: true

    - uses: actions/setup-go@v2
      with:
        # Pinned to match go.mod - '^1.20' was floating to newer releases.
        go-version: '1.23.2'
    - run: go version
    - name: Install Opensearch
      uses: ankane/setup-opensearch@v1
      with:
        # Matches Docker/docker-compose.yaml - v3 caused flaky test failures.
        opensearch-version: 2

    - name: Start LocalStack
      env:
          # These have to match up with the config in server.config.yaml
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      run: |
          # The localstack CLI's own bootstrap (`localstack start -d` /
          # `wait`) doesn't reliably start a container here - run the
          # image directly instead.
          docker run -d --name localstack_main \
            -p 4566:4566 \
            -e SERVICES=s3 \
            -e DEBUG=1 \
            localstack/localstack:2.2.0

          echo "Waiting for LocalStack startup..."
          timeout 60 bash -c 'until curl -sf http://localhost:4566/_localstack/health > /dev/null; do sleep 2; done'
          echo "Startup complete"
    - name: Initialize localstack
      run: |
          pip3 install awscli-local==0.21
          awslocal s3 mb s3://velociraptor
          awslocal s3 ls
          echo "Test Execution complete!"

    - name: Run tests
      run: |
        make test

    - name: Upload Build Artifacts
      if: ${{ failure() }}
      shell: bash
      run: |
        mkdir -p artifact_output/
        go test -v ./vql/uploads/ ./foreman/ ./ingestion/ -update
        cp -a ./vql/uploads/fixtures/* ./foreman/fixtures/* ./ingestion/fixtures/* artifact_output/

    - uses: actions/upload-artifact@master
      if: ${{ failure() }}
      with:
        name: artifact
        path: artifact_output
